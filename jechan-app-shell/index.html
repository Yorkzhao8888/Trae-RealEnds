<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F6FEB">
<title>捷才工友 · 选择身份</title>
<style>
  :root { --brand: #1F6FEB; --brand-2: #0B3F9E; --ink: #0B1220; --ink-2: #3A4A63; --ink-3: #7B8AA0; --soft: #F6F9FD; --line: #E4E9F2; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  .page { min-height: 100%; display: flex; flex-direction: column; padding: 32px 22px calc(28px + env(safe-area-inset-bottom)); }
  .head { display: flex; align-items: center; gap: 12px; margin: 18px 0 34px; }
  .mark { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(160deg, var(--brand), var(--brand-2));
    color: #fff; font-weight: 700; font-size: 26px; display: flex; align-items: center; justify-content: center; }
  .head b { font-size: 19px; letter-spacing: .5px; }
  .head span { display: block; font-size: 12px; color: var(--ink-3); letter-spacing: 2px; margin-top: 2px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .tip { color: var(--ink-3); font-size: 13.5px; margin-bottom: 22px; }
  .grid { display: grid; gap: 12px; }
  .card { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border: 1px solid var(--line);
    border-radius: 16px; background: var(--soft); text-decoration: none; color: inherit; transition: transform .12s, border-color .12s; }
  .card:active { transform: scale(.985); border-color: var(--brand); }
  .ico { width: 40px; height: 40px; border-radius: 12px; background: #fff; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: var(--brand); flex: 0 0 auto; }
  .txt b { font-size: 15.5px; }
  .txt i { display: block; font-style: normal; font-size: 12.5px; color: var(--ink-3); margin-top: 3px; }
  .arrow { margin-left: auto; color: var(--ink-3); font-size: 18px; }
  .foot { margin-top: auto; padding-top: 26px; text-align: center; color: var(--ink-3); font-size: 12px; line-height: 1.7; }
  .offline { display: none; margin: 0 0 18px; padding: 12px 14px; border-radius: 12px; background: #FFF4ED;
    color: #9A3412; font-size: 13px; }
  body.is-offline .offline { display: block; }
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div class="mark">J</div>
    <div><b>捷才工友</b><span>JECHAN</span></div>
  </div>

  <div class="offline" id="offline">当前网络不可用，请连网后再选择身份。</div>

  <h1>选择你的身份</h1>
  <div class="tip">四种身份对应四个独立工作台，可随时返回本页切换。</div>

  <div class="grid" id="ends">
    <a class="card" data-end="hp">
      <div class="ico">工</div>
      <div class="txt"><b>个人端 · 捷才工友</b><i>挂出技能，活来找你</i></div>
      <div class="arrow">›</div>
    </a>
    <a class="card" data-end="cp">
      <div class="ico">需</div>
      <div class="txt"><b>客户端 · 捷才需求方</b><i>说清需求，人才上门</i></div>
      <div class="arrow">›</div>
    </a>
    <a class="card" data-end="ep">
      <div class="ico">企</div>
      <div class="txt"><b>企业端 · 捷才企业</b><i>批量招人，合规留痕</i></div>
      <div class="arrow">›</div>
    </a>
    <a class="card" data-end="sp">
      <div class="ico">态</div>
      <div class="txt"><b>生态端 · 捷才生态</b><i>把渠道接进人才大市场</i></div>
      <div class="arrow">›</div>
    </a>
  </div>

  <div class="foot">捷才人才大市场 · Jechan<br>选择将记在本机，下次启动直接进入</div>
</div>

<script>
  var ENDS = {
    hp: { url: 'https://hp.jechan.cewaysoft.com/', name: '个人端' },
    cp: { url: 'https://cp.jechan.cewaysoft.com/', name: '客户端' },
    ep: { url: 'https://ep.jechan.cewaysoft.com/', name: '企业端' },
    sp: { url: 'https://sp.jechan.cewaysoft.com/', name: '生态端' }
  };
  var KEY = 'jechan.end';

  function go(id) {
    if (!ENDS[id]) return;
    try { localStorage.setItem(KEY, id); } catch (e) {}
    location.replace(ENDS[id].url);
  }

  function syncOffline() { document.body.classList.toggle('is-offline', navigator.onLine === false); }

  document.getElementById('ends').addEventListener('click', function (ev) {
    var card = ev.target.closest('[data-end]');
    if (!card) return;
    ev.preventDefault();
    go(card.dataset.end);
  });

  window.addEventListener('online', syncOffline);
  window.addEventListener('offline', syncOffline);
  syncOffline();

  // 已记住身份且不是主动“重新选择”（?pick=1）时，直接进入
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved && ENDS[saved] && !/pick=1/.test(location.search)) go(saved);
</script>
</body>
</html>
