name: android-apk

on:
  push:
    paths:
      - 'cajob-app-shell/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cajob-app-shell/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 镜像已自带 Android SDK，不需要 apt-get（此前因非 root 提权失败导致两次构建全红）
      - name: 准备 Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            echo "::error::未找到 sdkmanager：$SDKM"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 安装依赖并组装 webDir
        working-directory: cajob-app-shell
        run: |
          npm ci
          npm run prepare:web

      - name: sync Capacitor
        working-directory: cajob-app-shell
        run: npx cap sync android

      - name: 构建 Debug APK
        working-directory: cajob-app-shell/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: cajob-app-debug-apk
          path: cajob-app-shell/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
