name: android-apk

on:
  push:
    paths: ['cajob-app-shell/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cajob-app-shell/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK cmdline-tools (ubuntu-latest 已带 SDK platform-tools)
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager || true
          # ubuntu-latest (24.04) 已预装 cmdline-tools 和 platform-tools 在 $ANDROID_SDK_ROOT
          # 若缺 cmdline-tools 则手动装
          if ! command -v sdkmanager &> /dev/null; then
            apt-get update -y
            apt-get install -y android-sdk
          fi
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: 安装依赖并 sync Capacitor
        working-directory: cajob-app-shell
        run: |
          npm ci
          mkdir -p dist && cp index.html dist/   # webDir 占位（真实业务在 H5 根 server.url）
          npx cap sync android

      - name: 构建 Debug APK
        working-directory: cajob-app-shell/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: cajob-app-debug-apk
          path: cajob-app-shell/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
