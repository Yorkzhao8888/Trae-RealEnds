<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{displayName}} · 网络不可用</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; color: #0B1220;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { min-height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { color: #7B8AA0; font-size: 14px; margin: 0 0 22px; }
  button { appearance: none; border: 0; border-radius: 10px; background: {{accent}}; color: #fff;
    font: inherit; font-size: 15px; padding: 10px 22px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>当前网络不可用</h1>
    <p>恢复网络后重试；离线数据会在联网后自动补传。</p>
    <button onclick="location.reload()">重新加载</button>
  </div>
</div>
</body>
</html>
