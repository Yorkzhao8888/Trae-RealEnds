<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B6B5F">
<title>Cajob</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
  #splash { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
  #splash .logo { font-size: 48px; font-weight: 700; color: #0B6B5F; font-family: -apple-system, sans-serif; }
  #splash .sub { color: #999; font-size: 14px; margin-top: 8px; }
  #splash .loader { margin-top: 32px; width: 32px; height: 32px; border: 3px solid #e6f2ef; border-top-color: #0B6B5F; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* 加载线上失败时的离线兜底 */
  #offline { display: none; text-align: center; padding: 48px 24px; font-family: -apple-system, sans-serif; }
  #offline h2 { color: #1a1a1a; margin-bottom: 12px; }
  #offline p { color: #666; line-height: 1.6; }
  #offline button { margin-top: 20px; padding: 12px 32px; background: #0B6B5F; color: #fff; border: 0; border-radius: 10px; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>

<!-- 启动屏（壳加载线上 H5 期间显示） -->
<div id="splash">
  <div class="logo">Cajob</div>
  <div class="sub">真实端 · 职聘轻联</div>
  <div class="loader"></div>
</div>

<!-- 离线兜底（线上不可达时显示） -->
<div id="offline">
  <h2>网络连接有问题</h2>
  <p>Cajob 需要联网才能使用。请检查网络后重试。</p>
  <button onclick="location.reload()">重试</button>
</div>

<!-- 壳加载时会 redirect 到 https://h5.cewaycloud.com -->
<script type="module">
  // 壳启动：检查网络 → 尝试加载线上 H5 → 失败显示兜底
  const ONLINE_URL = 'https://h5.cewaycloud.com';

  async function boot() {
    // Capacitor 就绪后再 redirect，避免闪白
    if (window.Capacitor?.Plugins?.SplashScreen) {
      await window.Capacitor.Plugins.SplashScreen.hide();
    }

    // 先探测网络
    try {
      await fetch(ONLINE_URL + '/api/health', { method: 'HEAD', cache: 'no-store' });
      location.href = ONLINE_URL;
    } catch (e) {
      document.getElementById('splash').style.display = 'none';
      document.getElementById('offline').style.display = 'block';
    }
  }

  // Capacitor 就绪后执行
  if (window.Capacitor) {
    boot();
  } else {
    document.addEventListener('DOMContentLoaded', boot);
  }
</script>
</body>
</html>
